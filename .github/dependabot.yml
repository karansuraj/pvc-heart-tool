version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    ignore:
      # TypeScript 7.0.x (native Go compiler) has no JS compiler API, so
      # typescript-eslint cannot support it (peer range is <6.1.0) and
      # `npm install` fails with ERESOLVE on Vercel (see PR #47).
      # 7.1+ is NOT ignored: it is expected to ship the stable API.
      - dependency-name: "typescript"
        versions: ["7.0.x"]
    groups:
      # Group minor/patch updates together to reduce PR noise
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # Also monitor GitHub Actions if you add any workflows later
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
